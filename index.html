<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <header class="header">
      <h1 class="game-title">TETRIS</h1>
      <button id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Modo claro">
        <span id="theme-label">Modo claro</span>
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </button>
    </header>

    <div class="game-area">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
      <div id="pause-menu" class="pause-menu" role="dialog" aria-label="Menú de pausa">
        <p class="pause-title">PAUSA</p>
        <div id="pause-main" class="pause-main">
          <button type="button" id="pause-resume" class="menu-btn">Reanudar</button>
          <button type="button" id="pause-restart" class="menu-btn">Reiniciar</button>
          <button type="button" id="pause-controls-btn" class="menu-btn" aria-expanded="false">Ver controles</button>
          <label class="start-level">Nivel inicial
            <select id="start-level">
              <option value="1">1</option><option value="2">2</option><option value="3">3</option>
              <option value="4">4</option><option value="5">5</option><option value="6">6</option>
              <option value="7">7</option><option value="8">8</option><option value="9">9</option>
              <option value="10">10</option>
            </select>
          </label>
          <p class="pause-hint">Se aplica al reiniciar</p>
        </div>
        <ul id="pause-controls" class="pause-controls" hidden>
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
        </ul>
      </div>
    </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
